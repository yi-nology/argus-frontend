# argus-frontend CI/CD：tag v* 出 GHCR 多架构镜像（nginx 静态 SPA）。
# 纪律与 argus 主仓一致：仅 GITHUB_TOKEN；镜像名 ghcr.io/yi-nology/argus-frontend。
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: typecheck + build + image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build dist
        run: npm run build

      # amd64 冒烟：起容器 curl / 与 /api 反代链路（/api 打到不存在的后端
      # 应返回 502 而非 404——证明反代生效、静态路由不吞 /api）。
      - name: Smoke test (amd64)
        run: |
          docker buildx build --platform linux/amd64 --load -t argus-fe-smoke .
          docker run -d --name smoke -p 18080:80 argus-fe-smoke
          for i in $(seq 1 10); do curl -sf http://127.0.0.1:18080/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/ | grep -q "<div id=\"root\"" && echo "✓ SPA index"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/auth/me)
          [ "$code" = "502" ] && echo "✓ /api 反代生效（502=后端未起，非 404）"
          [ "$code" = "502" ] || { echo "✗ /api 未走反代: $code"; exit 1; }
          curl -sf http://127.0.0.1:18080/settings/repos | grep -q "<div id=\"root\"" && echo "✓ SPA fallback"
          docker rm -f smoke > /dev/null

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yi-nology/argus-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
