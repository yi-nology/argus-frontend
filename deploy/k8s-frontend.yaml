# argus-frontend 部署（镜像形态；v8.4.0 起 GHCR 出多架构镜像，hostPath 形态退役）。
# 镜像内含 dist/ + nginx.conf（SPA + /api 同源反代免 CORS）。
# 部署：kubectl apply -f deploy/k8s-frontend.yaml （镜像 ghcr.io/yi-nology/argus-frontend:vX.Y.Z）
# 访问：NodePort 30898（紧邻 argus 后端 30899；后端 API 同源 /api/* 反代）

apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-frontend
  namespace: argus
  labels:
    app: argus-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-frontend
  template:
    metadata:
      labels:
        app: argus-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yi-nology/argus-frontend:v8.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: argus-frontend
  namespace: argus
  labels:
    app: argus-frontend
spec:
  type: NodePort
  selector:
    app: argus-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30898   # 紧邻 argus 后端 30899（30880 被 ks-console 占）
