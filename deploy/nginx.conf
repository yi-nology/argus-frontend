# argus-frontend nginx 配置（43 部署，deploy/k8s-frontend.yaml 引用）。
# 同源架构：静态 SPA + /api/ 反代剥前缀 → argus:8899（集群 Service），
# 免 CORS；前端 VITE_API_BASE=/api（缺省值，构建无需传参）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由兜底：未知路径回 index.html（前端 router 接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代：/api/<path> → argus:8899/<path>（proxy_pass 尾斜杠剥 /api 前段，
    # 与 umi dev proxy 的 pathRewrite 等价）。^~ 前缀优先于下方资源正则，防误吞。
    location ^~ /api/ {
        proxy_pass http://argus:8899/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # 长查询/QA 回答不被默认 60s 掐断
        proxy_send_timeout 300s;
    }

    # Umi 构建产物带 content-hash（umi.<hash>.js / p__<page>.<hash>.css 等），
    # 文件名即指纹，可长缓存。
    location ~* \.[a-f0-9]{8}\.(?:js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（发版即生效）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
